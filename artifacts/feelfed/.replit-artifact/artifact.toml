kind = "mobile"
previewPath = "/"
title = "FeelFed"
description = "An iOS-first, private body-awareness journal for recording fullness, energy, hydration, meals, drinks, movement and factual visit summaries."
version = "1.0.0"
id = "artifacts/feelfed"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24914

[services.development]
run = "pnpm --filter @workspace/feelfed run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/feelfed", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/feelfed", "run", "serve" ]

[services.env]
PORT = "24914"
BASE_PATH = "/"
